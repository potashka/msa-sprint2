replicaCount: 1

version: v2

image:
  name: booking-service
  tag: latest
  pullPolicy: Never

env:
  - name: ENABLE_FEATURE_X
    value: "true"
  - name: SERVICE_VERSION
    value: "v2"

service:
  create: false
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  path: /ping
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /ready
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
