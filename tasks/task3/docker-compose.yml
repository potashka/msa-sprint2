services:
  apollo-gateway:
    build: ./gateway
    container_name: hotelio-apollo-gateway
    ports:
      - "4000:4000"
    environment:
      BOOKING_SUBGRAPH_URL: http://booking-subgraph:4001
      HOTEL_SUBGRAPH_URL: http://hotel-subgraph:4002
    depends_on:
      - booking-subgraph
      - hotel-subgraph
    networks:
      - task3-net

  booking-subgraph:
    build: ./booking-subgraph
    container_name: hotelio-booking-subgraph
    ports:
      - "4001:4001"
    networks:
      - task3-net

  hotel-subgraph:
    build: ./hotel-subgraph
    container_name: hotelio-hotel-subgraph
    ports:
      - "4002:4002"
    environment:
      MONOLITH_URL: ${MONOLITH_URL:-}
    networks:
      - task3-net

networks:
  task3-net:
    name: hotelio-task3-net
