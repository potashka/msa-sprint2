services:
  monolith:
    build:
      context: ../../hotelio-monolith
      dockerfile: Dockerfile
    container_name: hotelio-monolith
    ports:
      - "8084:8080"
    networks:
      - hotelio-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
      BOOKING_SERVICE_EXTERNAL_HOST: booking-service
      BOOKING_SERVICE_EXTERNAL_PORT: 9090
    depends_on:
      - monolith-db
      - booking-service

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: hotelio-booking-service
    ports:
      - "9090:9090"
    environment:
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 9090
      MONOLITH_URL: http://monolith:8080
      PGHOST: booking-db
      PGPORT: 5432
      PGDATABASE: booking
      PGUSER: booking
      PGPASSWORD: booking
      KAFKA_BROKERS: kafka:9092
      BOOKING_TOPIC: booking.created
    depends_on:
      - booking-db
      - kafka
    networks:
      - hotelio-net

  booking-db:
    image: postgres:15
    container_name: hotelio-booking-db
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5433:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  booking-history-service:
    build:
      context: .
      dockerfile: booking-history-service/Dockerfile
    container_name: hotelio-booking-history-service
    environment:
      PGHOST: history-db
      PGPORT: 5432
      PGDATABASE: history
      PGUSER: history
      PGPASSWORD: history
      KAFKA_BROKERS: kafka:9092
      BOOKING_TOPIC: booking.created
    depends_on:
      - history-db
      - kafka
    networks:
      - hotelio-net

  history-db:
    image: postgres:15
    container_name: hotelio-history-db
    environment:
      POSTGRES_USER: history
      POSTGRES_PASSWORD: history
      POSTGRES_DB: history
    ports:
      - "5434:5432"
    volumes:
      - history-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  monolith-db:
    image: postgres:15
    container_name: hotelio-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    ports:
      - "5432:5432"
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hotelio-net
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net

volumes:
  monolith-db-data:
  booking-db-data:
  history-db-data:

networks:
  hotelio-net:
    external: true
