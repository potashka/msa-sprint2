stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_NAME: booking-service
  IMAGE_TAG: latest

build:
  stage: build
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} ./booking-service

test:
  stage: test
  script:
    - docker rm -f booking-service-test 2>/dev/null || true
    - docker run -d --name booking-service-test -p 8080:8080 ${IMAGE_NAME}:${IMAGE_TAG}
    - sleep 2
    - curl --fail http://localhost:8080/ping
    - curl --fail http://localhost:8080/ready
    - docker rm -f booking-service-test

deploy:
  stage: deploy
  script:
    - minikube image load ${IMAGE_NAME}:${IMAGE_TAG}
    - helm upgrade --install booking-service ./helm/booking-service --set image.name=${IMAGE_NAME} --set image.tag=${IMAGE_TAG} --set image.pullPolicy=Never
    - kubectl rollout status deployment/booking-service

tag:
  stage: tag
  script:
    - export RELEASE_TAG="task4-$(date +%Y%m%d%H%M%S)"
    - echo "Local safe tag command:"
    - echo "git tag ${RELEASE_TAG} && git push origin ${RELEASE_TAG}"
